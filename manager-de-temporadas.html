<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Manager de Temporadas</title>
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--acc:#e5e7eb;--on:#111;--txt:#f3f4f6;--mut:#8a8f98;--line:rgba(255,255,255,.09);--danger:#ff4d5e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#000}
body{margin:0;background:#000;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;background:var(--acc);animation:drift 20s ease-in-out infinite alternate;transition:background .4s}
.bg i:nth-child(1){width:460px;height:460px;top:-140px;left:-120px}
.bg i:nth-child(2){width:380px;height:380px;bottom:-120px;right:-90px;animation-delay:-8s}
.bg i:nth-child(3){width:260px;height:260px;top:45%;left:55%;animation-delay:-14s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
.wrap{position:relative;z-index:1;max-width:1100px;margin:auto;padding:24px 16px 90px;display:flex;flex-direction:column;gap:18px}
.kicker{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
h2{margin:0 0 16px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:700}
label{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}

/* ---- cuadros con brillo animado ---- */
.card{position:relative;border-radius:20px;padding:20px;background:rgba(14,14,17,.58);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.06);box-shadow:0 0 46px -16px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .25s,box-shadow .25s}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 60%,var(--acc) 86%,#fff 93%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:spin 6s linear infinite}
@keyframes spin{to{--ang:360deg}}
.sub{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px}

/* ---- inputs / botones ---- */
input[type=text],select{width:100%;padding:11px 13px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);border-radius:10px;font:inherit;font-size:.92rem;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=text]::placeholder{color:#575c65}
input[type=text]:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select option{background:#0b0b0d}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:700;background:var(--acc);color:var(--on);box-shadow:0 0 26px -8px var(--acc);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #ff4d5e55;box-shadow:none;font-weight:500}
.btn.sm{padding:7px 12px;font-size:.8rem;border-radius:9px}

/* ---- club ---- */
.club{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.logo{width:112px;height:112px;border-radius:20px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:.72rem;text-align:center;cursor:pointer;flex:none;transition:border-color .2s}
.logo:hover{border-color:var(--acc)}
.logo img{width:100%;height:100%;object-fit:contain}
.club-main{flex:1;min-width:230px}
#clubName{font-size:1.9rem;font-weight:800;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0;letter-spacing:-.01em}
#clubName:focus{box-shadow:none;border-color:var(--acc)}
.club-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;gap:8px;padding:7px 11px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--txt)}
.cbtn i{width:22px;height:22px;border-radius:7px;border:1px solid #fff4;flex:none}
.cbtn span{font-size:.75rem;font-family:ui-monospace,monospace}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{color:var(--mut);font-size:.85rem}

/* ---- temporadas ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.scard{cursor:pointer}
.scard:hover{transform:translateY(-4px)}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.s-name{font-size:1.4rem;font-weight:800;letter-spacing:-.01em}
.badge{display:inline-block;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);color:var(--acc);border-radius:99px;padding:2px 11px;font-size:.72rem;font-weight:600;white-space:nowrap}
.mini{display:flex;justify-content:center;gap:6px;margin:10px 0}
.mini svg{width:30%;max-width:92px;height:auto}
.mini .none{color:var(--mut);font-size:.8rem;padding:22px 0}
.s-info{font-size:.8rem;color:var(--mut);margin-bottom:12px}
.empty{color:var(--mut);text-align:center;padding:34px 10px}

/* ---- editor ---- */
.back{background:none;border:0;color:var(--mut);padding:0;font-size:.85rem;letter-spacing:.05em}
.back:hover{color:var(--acc)}
.kits{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.kit-h{display:flex;gap:8px;margin-bottom:10px}
.kit-h .kname{font-weight:700}
.shirts{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.shirts svg{width:46%;max-width:140px;height:auto;filter:drop-shadow(0 6px 14px #0009)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cols .cbtn{width:100%;padding:6px 8px}
.fields{display:grid;gap:9px}
.lu-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pitch{position:relative;width:100%;max-width:520px;aspect-ratio:3/4;margin:18px auto 0;border-radius:16px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 10%,transparent 10% 20%),#050506;border:1px solid var(--line);overflow:hidden}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--acc);stroke-opacity:.35;stroke-width:1.4}
.pl{position:absolute;transform:translate(-50%,-50%);width:17%;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:3px}
.pl .pshirt{width:100%}
.pl .pshirt svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 6px #000c)}
.pl input{width:132%;text-align:center;padding:3px 2px;font-size:.72rem;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.14);border-radius:6px;color:#fff;outline:none}
.pl input:focus{border-color:var(--acc);box-shadow:none}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media(max-width:560px){.add-row{grid-template-columns:1fr}.pl input{font-size:.62rem}#clubName{font-size:1.5rem}}

/* ---- selector de color ---- */
#picker{position:fixed;z-index:50;width:244px;background:rgba(10,10,12,.96);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;box-shadow:0 20px 60px #000,0 0 40px -12px var(--acc);display:none;backdrop-filter:blur(14px)}
#picker canvas{width:100%;height:140px;border-radius:10px;cursor:crosshair;display:block;touch-action:none}
#picker input[type=range]{width:100%;margin:10px 0;-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#picker input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #000}
#picker input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #000}
.pk-row{display:flex;gap:8px;align-items:center}
.pk-row i{width:34px;height:34px;border-radius:9px;border:1px solid #fff4;flex:none}
.presets{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}
.presets b{aspect-ratio:1;border-radius:6px;border:1px solid #fff3;cursor:pointer}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div class="wrap">

  <!-- ================= CLUB ================= -->
  <div id="viewClub" style="display:flex;flex-direction:column;gap:18px">
    <div class="kicker">Manager de temporadas</div>

    <div class="card">
      <div class="club">
        <div class="logo" id="logo" title="Subir imagen">Subir escudo</div>
        <div class="club-main">
          <label>Nombre del club</label>
          <input type="text" id="clubName" placeholder="Nombre del equipo" maxlength="40" autocomplete="off">
          <div class="club-row">
            <div>
              <label style="margin:0 0 5px">Color principal del club</label>
              <button type="button" class="cbtn" id="clubColor"><i></i><span></span></button>
            </div>
            <button type="button" class="btn danger sm" id="logoDel" style="margin-top:18px">Quitar imagen</button>
          </div>
        </div>
      </div>
      <input type="file" id="logoFile" accept="image/*" hidden>
    </div>

    <div class="bar">
      <div><h2 style="margin:0">Temporadas</h2><div class="count" id="count"></div></div>
      <button class="btn" id="newSeason" type="button">＋ Nueva temporada</button>
    </div>
    <div class="grid" id="list"></div>
    <div class="empty" id="empty">Todavía no creaste ninguna temporada.</div>
  </div>

  <!-- ================= TEMPORADA ================= -->
  <div id="viewSeason" hidden style="flex-direction:column;gap:18px">
    <div>
      <button class="back" id="back" type="button">← Volver al club</button>
      <div style="font-size:1.6rem;font-weight:800;margin-top:6px" id="sTitle"></div>
    </div>

    <div class="card">
      <div class="bar" style="margin-bottom:16px"><h2 style="margin:0">Equipaciones</h2><button class="btn ghost sm" id="addKit" type="button">＋ Añadir equipación</button></div>
      <div class="empty" id="kitEmpty" style="padding:18px 0">Todavía no cargaste equipaciones. Podés añadir hasta 3.</div>
      <div class="kits" id="kits"></div>
    </div>

    <div class="card">
      <h2>Alineación</h2>
      <div class="lu-row">
        <div><label>Nombre de la alineación</label><input type="text" id="luName" placeholder="Ej: Alineación principal"></div>
        <div><label>DT</label><input type="text" id="luCoach" placeholder="Nombre del DT"></div>
        <div><label>Esquema</label><select id="luForm"></select></div>
        <div><label>Camiseta</label><select id="luKit"></select></div>
      </div>
      <div class="pitch" id="pitch">
        <svg class="lines" viewBox="0 0 300 400" preserveAspectRatio="none"><rect x="6" y="6" width="288" height="388"/><line x1="6" y1="200" x2="294" y2="200"/><circle cx="150" cy="200" r="36"/><rect x="80" y="6" width="140" height="60"/><rect x="80" y="334" width="140" height="60"/><rect x="115" y="6" width="70" height="22"/><rect x="115" y="372" width="70" height="22"/></svg>
      </div>
    </div>

    <div class="card">
      <h2>Temporada y juego</h2>
      <div class="add-row">
        <div><label>Temporada</label><input type="text" id="seasonName" placeholder="Ej: 2026/27" maxlength="20"></div>
        <div><label>Juego</label><select id="game"></select></div>
      </div>
      <div class="foot">
        <button class="btn" id="saveSeason" type="button">Guardar temporada</button>
        <button class="btn ghost" id="cancelSeason" type="button">Cancelar</button>
        <button class="btn danger" id="delSeason" type="button" hidden>Borrar temporada</button>
      </div>
    </div>
  </div>

</div>

<div id="picker">
  <canvas id="pkSV" width="480" height="280"></canvas>
  <input type="range" id="pkHue" min="0" max="360" value="0">
  <div class="pk-row"><i id="pkPrev"></i><input type="text" id="pkHex" maxlength="7" spellcheck="false"></div>
  <div class="presets" id="presets"></div>
</div>

<script>
const GAMES=['FC 27','FC 26','FC 25','FC 24','FIFA 23','FIFA 19','FIFA 17','PES 2017','SPFL 27','PES 2006'];
const KIT_NAMES=['Local','Visitante','Tercera'];
const COL_NAMES=['Principal','Secundario','Terciario'];
const FORMS=['4-4-2','4-3-3','4-2-3-1','4-1-4-1','4-5-1','4-3-2-1','4-4-1-1','4-1-2-1-2','3-5-2','3-4-3','5-3-2','5-4-1'];
const PRESETS=['#ffffff','#111111','#6b7280','#d32f2f','#f97316','#f5c518','#22c55e','#065f46','#06b6d4','#1e3a8a','#2563eb','#7c3aed','#db2777','#7f1d1d','#92400e','#cbd5e1'];
const PH={c:['#2a2a2a','#2a2a2a','#444444']};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let club={name:'',logo:'',color:'#e5e7eb'}, seasons=[], cur=null, curId=null, warned=false;
const defLineup=()=>({name:'Alineación principal',coach:'',formation:'4-4-2',kit:0,players:Array(11).fill('')});
const newSeason=()=>({season:'',game:GAMES[0],kits:[],lineup:defLineup()});

/* ---------- almacenamiento ---------- */
function load(){try{const d=JSON.parse(localStorage.getItem('seasonManager2')||'{}');if(d.club)club=Object.assign(club,d.club);seasons=d.seasons||[]}catch(e){}}
function save(){try{localStorage.setItem('seasonManager2',JSON.stringify({club,seasons}))}catch(e){if(!warned){warned=true;alert('No se pudo guardar (almacenamiento lleno o imagen muy pesada).')}}}

/* ---------- colores ---------- */
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('')}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;if(d){if(M===r)h=((g-b)/d)%6;else if(M===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,M?d/M:0,M]}
function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255]}
function textOn(hex){const[r,g,b]=hexToRgb(hex);return(r*299+g*587+b*114)/1000>150?'#111':'#fff'}
const validHex=h=>/^#[0-9a-fA-F]{6}$/.test(h);
function setAccent(h){const s=document.documentElement.style;s.setProperty('--acc',h);s.setProperty('--on',textOn(h))}

/* ---------- selector de color integrado ---------- */
const pk=$('picker'),cv=$('pkSV'),cx=cv.getContext('2d');
let P={h:0,s:1,v:1,cb:null,anchor:null},drag=false;
function drawSV(){
  cx.fillStyle=rgbToHex(...hsvToRgb(P.h,1,1));cx.fillRect(0,0,cv.width,cv.height);
  let g=cx.createLinearGradient(0,0,cv.width,0);g.addColorStop(0,'#fff');g.addColorStop(1,'#fff0');cx.fillStyle=g;cx.fillRect(0,0,cv.width,cv.height);
  g=cx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#0000');g.addColorStop(1,'#000');cx.fillStyle=g;cx.fillRect(0,0,cv.width,cv.height);
  cx.beginPath();cx.arc(P.s*cv.width,(1-P.v)*cv.height,9,0,7);cx.lineWidth=3;cx.strokeStyle='#fff';cx.stroke();cx.lineWidth=1;cx.strokeStyle='#000';cx.stroke();
}
function pkApply(fromHex){
  const hex=rgbToHex(...hsvToRgb(P.h,P.s,P.v));
  drawSV();$('pkPrev').style.background=hex;$('pkHue').value=P.h;
  if(!fromHex)$('pkHex').value=hex;
  P.cb&&P.cb(hex);
}
function setHex(hex){const[h,s,v]=rgbToHsv(...hexToRgb(hex));if(s>0&&v>0)P.h=h;P.s=s;P.v=v}
function svPick(e){const r=cv.getBoundingClientRect();P.s=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));P.v=1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));pkApply()}
cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);svPick(e)});
cv.addEventListener('pointermove',e=>{if(drag)svPick(e)});
cv.addEventListener('pointerup',()=>drag=false);
$('pkHue').addEventListener('input',e=>{P.h=+e.target.value;pkApply()});
$('pkHex').addEventListener('input',e=>{let v=e.target.value.trim();if(v[0]!=='#')v='#'+v;if(validHex(v)){setHex(v);pkApply(true)}});
$('presets').innerHTML=PRESETS.map(c=>`<b style="background:${c}" data-c="${c}"></b>`).join('');
$('presets').addEventListener('click',e=>{const c=e.target.dataset.c;if(c){setHex(c);pkApply()}});
function openPicker(btn,hex,cb){
  P.cb=null;setHex(hex);P.anchor=btn;pk.style.display='block';
  const r=btn.getBoundingClientRect();let top=r.bottom+6,left=r.left;
  if(top+pk.offsetHeight>innerHeight-8)top=Math.max(8,r.top-pk.offsetHeight-6);
  if(left+244>innerWidth-8)left=innerWidth-252;
  pk.style.top=top+'px';pk.style.left=Math.max(8,left)+'px';
  pkApply();P.cb=cb;
}
document.addEventListener('pointerdown',e=>{if(pk.style.display==='block'&&!pk.contains(e.target)&&!(P.anchor&&P.anchor.contains(e.target)))pk.style.display='none'});
addEventListener('scroll',()=>pk.style.display='none',true);

/* ---------- camiseta ---------- */
function shirt(k,side,num){
  const[c1,c2,c3]=k.c,t1=textOn(c1),back=side==='back';
  let txt='';
  if(side==='plain'){
    txt+=`<text x="100" y="112" text-anchor="middle" font-size="58" font-weight="800" fill="${t1}" font-family="Arial">${num}</text>`;
  }else if(!back){
    if(k.main)txt+=`<text x="100" y="92" text-anchor="middle" font-size="${Math.min(15,150/Math.max(6,k.main.length)*1.7)}" font-weight="700" fill="${t1}" font-family="Arial">${esc(k.main.slice(0,14))}</text>`;
    if(k.brand)txt+=`<text x="132" y="52" text-anchor="middle" font-size="7" font-weight="700" fill="${t1}" font-family="Arial">${esc(k.brand.slice(0,10))}</text>`;
    if(k.shoulder)txt+=`<text transform="translate(40,60) rotate(-48)" text-anchor="middle" font-size="6.5" font-weight="700" fill="${textOn(c2)}" font-family="Arial">${esc(k.shoulder.slice(0,9))}</text><text transform="translate(160,60) rotate(48)" text-anchor="middle" font-size="6.5" font-weight="700" fill="${textOn(c2)}" font-family="Arial">${esc(k.shoulder.slice(0,9))}</text>`;
  }else{
    txt+=`<text x="100" y="95" text-anchor="middle" font-size="46" font-weight="800" fill="${t1}" font-family="Arial" opacity=".9">10</text>`;
    if(k.back)txt+=`<text x="100" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="${t1}" font-family="Arial">${esc(k.back.slice(0,16))}</text>`;
  }
  const collar=back?`<path d="M82 14 Q100 26 118 14 L118 20 Q100 32 82 20Z" fill="${c3}"/>`:`<path d="M82 14 Q100 40 118 14 L118 21 Q100 48 82 21Z" fill="${c3}"/>`;
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <path d="M62 20 L84 12 Q100 26 116 12 L138 20 L186 56 L166 88 L146 72 L146 186 L54 186 L54 72 L34 88 L14 56 Z" fill="${c1}" stroke="#0006" stroke-width="1.5"/>
  <path d="M62 20 L14 56 L34 88 L54 72 L54 36Z" fill="${c2}" stroke="#0004"/>
  <path d="M138 20 L186 56 L166 88 L146 72 L146 36Z" fill="${c2}" stroke="#0004"/>
  <path d="M14 56 L34 88 L40 83 L21 52Z" fill="${c3}"/><path d="M186 56 L166 88 L160 83 L179 52Z" fill="${c3}"/>
  <rect x="54" y="178" width="92" height="8" fill="${c3}"/>
  ${collar}${txt}</svg>`;
}

/* ---------- club ---------- */
function renderLogo(){$('logo').innerHTML=club.logo?`<img src="${club.logo}" alt="">`:'Subir escudo'}
function renderClubColor(){const b=$('clubColor');b.querySelector('i').style.background=club.color;b.querySelector('span').textContent=club.color;setAccent(club.color)}
$('clubName').addEventListener('input',e=>{club.name=e.target.value;save()});
$('logo').onclick=()=>$('logoFile').click();
$('logoDel').onclick=()=>{club.logo='';renderLogo();save()};
$('logoFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image,url=URL.createObjectURL(f);
  img.onload=()=>{const m=256,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);club.logo=c.toDataURL('image/png');URL.revokeObjectURL(url);renderLogo();save();renderSeasons()};
  img.src=url;e.target.value='';
});
$('clubColor').onclick=e=>openPicker(e.currentTarget,club.color,hex=>{club.color=hex;renderClubColor();save()});

function renderSeasons(){
  const l=$('list');l.innerHTML='';
  $('empty').hidden=seasons.length>0;
  $('count').textContent=seasons.length?`${seasons.length} ${seasons.length===1?'temporada':'temporadas'}`:'';
  seasons.forEach(s=>{
    const d=document.createElement('div');d.className='card scard';
    const lu=s.lineup;
    d.innerHTML=`<div class="s-top"><div class="s-name">${esc(s.season)}</div><span class="badge">${esc(s.game)}</span></div>
    <div class="mini">${s.kits.length?s.kits.map(k=>shirt(k,'front')).join(''):'<div class="none">Sin equipaciones</div>'}</div>
    <div class="s-info">${esc(lu.name||'Alineación')} · ${esc(lu.formation)}${lu.coach?' · DT: '+esc(lu.coach):''}</div>
    <button class="btn danger sm" type="button">Borrar</button>`;
    d.onclick=()=>openSeason(s.id);
    d.querySelector('button').onclick=e=>{e.stopPropagation();if(confirm('¿Borrar la temporada '+s.season+'?')){seasons=seasons.filter(x=>x.id!==s.id);save();renderSeasons()}};
    l.appendChild(d);
  });
}

/* ---------- navegación ---------- */
function show(v){
  $('viewClub').hidden=v!=='club';$('viewSeason').hidden=v!=='season';
  $('viewSeason').style.display=v==='season'?'flex':'none';
  $('viewClub').style.display=v==='club'?'flex':'none';
  pk.style.display='none';scrollTo({top:0});
}
$('newSeason').onclick=()=>{
  if(!club.name.trim()){alert('Primero poné el nombre del club.');$('clubName').focus();return}
  openSeason(null);
};
function openSeason(id){
  curId=id;
  cur=id?JSON.parse(JSON.stringify(seasons.find(s=>s.id===id))):newSeason();
  $('sTitle').textContent=club.name+(id?' · '+cur.season:' · Nueva temporada');
  $('seasonName').value=cur.season;$('game').value=cur.game;
  $('delSeason').hidden=!id;
  const L=cur.lineup;
  $('luName').value=L.name;$('luCoach').value=L.coach;$('luForm').value=L.formation;
  renderKits();syncKitSelect();renderPitch();
  show('season');
}
$('back').onclick=$('cancelSeason').onclick=()=>show('club');
$('saveSeason').onclick=()=>{
  const sn=$('seasonName').value.trim();
  if(!sn){alert('Poné el nombre de la temporada.');$('seasonName').focus();return}
  cur.season=sn;cur.game=$('game').value;
  if(curId)seasons=seasons.map(s=>s.id===curId?{...cur,id:curId}:s);else seasons.unshift({...cur,id:Date.now()});
  save();renderSeasons();show('club');
};
$('delSeason').onclick=()=>{if(confirm('¿Borrar esta temporada?')){seasons=seasons.filter(s=>s.id!==curId);save();renderSeasons();show('club')}};

/* ---------- equipaciones ---------- */
$('addKit').onclick=()=>{
  if(cur.kits.length>=3)return;
  cur.kits.push({name:KIT_NAMES[cur.kits.length],c:['#2e2e2e','#5a5a5a','#8a8a8a'],brand:'',main:'',shoulder:'',back:''});
  renderKits();syncKitSelect();updatePitchShirts();
};
function renderKits(){
  const box=$('kits');box.innerHTML='';
  $('kitEmpty').hidden=cur.kits.length>0;
  $('addKit').hidden=cur.kits.length>=3;
  cur.kits.forEach((k,i)=>{
    const d=document.createElement('div');d.className='sub';
    d.innerHTML=`<div class="kit-h"><input type="text" class="kname" value="${esc(k.name)}" maxlength="20" placeholder="Nombre de la equipación"><button type="button" class="btn danger sm" data-del>Quitar</button></div>
    <div class="shirts"><div data-f></div><div data-b></div></div>
    <div class="cols">${COL_NAMES.map((n,j)=>`<div><label>${n}</label><button type="button" class="cbtn" data-j="${j}"><i style="background:${k.c[j]}"></i><span>${k.c[j]}</span></button></div>`).join('')}</div>
    <div class="fields">
      <div><label>Marca</label><input type="text" data-k="brand" placeholder="Ej: Nike" value="${esc(k.brand)}"></div>
      <div><label>Sponsor principal</label><input type="text" data-k="main" placeholder="Ej: Emirates" value="${esc(k.main)}"></div>
      <div><label>Sponsor de hombros</label><input type="text" data-k="shoulder" placeholder="Ej: Visit" value="${esc(k.shoulder)}"></div>
      <div><label>Sponsor trasero</label><input type="text" data-k="back" placeholder="Ej: Pepsi" value="${esc(k.back)}"></div>
    </div>`;
    const upd=()=>{d.querySelector('[data-f]').innerHTML=shirt(k,'front');d.querySelector('[data-b]').innerHTML=shirt(k,'back');updatePitchShirts()};
    upd();
    d.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;
      openPicker(b,k.c[j],hex=>{k.c[j]=hex;b.querySelector('i').style.background=hex;b.querySelector('span').textContent=hex;upd()});
    });
    d.querySelectorAll('input[data-k]').forEach(inp=>inp.addEventListener('input',()=>{k[inp.dataset.k]=inp.value;upd()}));
    d.querySelector('.kname').addEventListener('input',e=>{k.name=e.target.value;syncKitSelect()});
    d.querySelector('[data-del]').onclick=()=>{
      cur.kits.splice(i,1);
      if(cur.lineup.kit>=cur.kits.length)cur.lineup.kit=0;
      renderKits();syncKitSelect();updatePitchShirts();
    };
    box.appendChild(d);
  });
}

/* ---------- alineación ---------- */
$('game').innerHTML=GAMES.map(g=>`<option>${g}</option>`).join('');
$('luForm').innerHTML=FORMS.map(f=>`<option>${f}</option>`).join('');
$('luName').addEventListener('input',e=>cur.lineup.name=e.target.value);
$('luCoach').addEventListener('input',e=>cur.lineup.coach=e.target.value);
$('luForm').addEventListener('change',e=>{cur.lineup.formation=e.target.value;renderPitch()});
$('luKit').addEventListener('change',e=>{cur.lineup.kit=+e.target.value;updatePitchShirts()});
function syncKitSelect(){
  const s=$('luKit');
  s.innerHTML=cur.kits.length?cur.kits.map((k,i)=>`<option value="${i}">${esc(k.name||KIT_NAMES[i])}</option>`).join(''):'<option value="0">Sin equipación</option>';
  s.value=cur.lineup.kit;
}
function renderPitch(){
  const L=cur.lineup,p=$('pitch');
  p.querySelectorAll('.pl').forEach(e=>e.remove());
  const rows=[1,...L.formation.split('-').map(Number)],n=rows.length;let idx=0;
  rows.forEach((cnt,r)=>{
    const y=90-r*(78/(n-1));
    for(let i=0;i<cnt;i++){
      const el=document.createElement('div');el.className='pl';
      el.style.left=((i+1)/(cnt+1)*100)+'%';el.style.top=y+'%';
      el.innerHTML=`<div class="pshirt" data-n="${idx+1}"></div><input type="text" maxlength="18" placeholder="Jugador ${idx+1}" value="${esc(L.players[idx]||'')}">`;
      const k=idx;el.querySelector('input').addEventListener('input',e=>L.players[k]=e.target.value);
      p.appendChild(el);idx++;
    }
  });
  updatePitchShirts();
}
function updatePitchShirts(){
  const k=cur.kits[cur.lineup.kit]||PH;
  $('pitch').querySelectorAll('.pshirt').forEach(d=>d.innerHTML=shirt(k,'plain',d.dataset.n));
}

/* ---------- inicio ---------- */
load();
$('clubName').value=club.name;
renderLogo();renderClubColor();renderSeasons();show('club');
</script>
</body>
</html>
